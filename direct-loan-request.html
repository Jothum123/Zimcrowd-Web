<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZimCrowd Direct - Instant Loan Offer</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .offer-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .offer-header {
            background: linear-gradient(135deg, #38e07b 0%, #2ecc71 100%);
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .offer-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .direct-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 15px;
            backdrop-filter: blur(10px);
        }

        .offer-header h1 {
            color: white;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .offer-header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            position: relative;
        }
        
        /* Currency Selector */
        .currency-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
        }
        
        .currency-btn {
            padding: 12px 30px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .currency-btn:hover {
            border-color: #38e07b;
            background: #f0fdf4;
        }
        
        .currency-btn.active {
            border-color: #38e07b;
            background: #38e07b;
            color: white;
        }
        
        .currency-btn .flag {
            font-size: 20px;
        }
        
        .rate-badge {
            display: inline-block;
            background: #fef3c7;
            color: #92400e;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 8px;
            z-index: 1;
        }

        .offer-body {
            padding: 40px 30px;
        }

        .loading-state {
            text-align: center;
            padding: 40px 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .amount-display {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
            background: linear-gradient(135deg, #f8f9ff 0%, #f0f4ff 100%);
            border-radius: 16px;
            border: 2px solid #e0e7ff;
        }

        .amount-label {
            color: #64748b;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .amount-value {
            font-size: 56px;
            font-weight: 700;
            color: #1e293b;
            line-height: 1;
            margin-bottom: 10px;
        }

        .amount-subtitle {
            color: #64748b;
            font-size: 14px;
        }

        .breakdown-section {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .breakdown-title {
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 15px;
        }

        .breakdown-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .breakdown-row:last-child {
            border-bottom: none;
            padding-top: 15px;
            margin-top: 5px;
            border-top: 2px solid #cbd5e1;
        }

        .breakdown-label {
            color: #64748b;
            font-size: 14px;
        }

        .breakdown-value {
            font-weight: 600;
            color: #1e293b;
            font-size: 16px;
        }

        .breakdown-row:last-child .breakdown-value {
            color: #667eea;
            font-size: 20px;
        }

        .apr-disclosure {
            background: #fef3c7;
            border: 1px solid #fbbf24;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 30px;
        }

        .apr-disclosure strong {
            color: #92400e;
            font-size: 16px;
        }

        .apr-disclosure p {
            color: #78350f;
            font-size: 13px;
            margin-top: 5px;
            line-height: 1.5;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .feature-item {
            text-align: center;
            padding: 20px 10px;
            background: #f8fafc;
            border-radius: 12px;
            transition: all 0.3s;
        }

        .feature-item:hover {
            background: #f0f4ff;
            transform: translateY(-2px);
        }

        .feature-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .feature-text {
            font-size: 12px;
            color: #64748b;
            font-weight: 600;
        }

        .cta-button {
            width: 100%;
            padding: 18px;
            background: #0f172a;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.4);
        }

        .cta-button:hover {
            transform: translateY(-2px);
            background: #1e293b;
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.5);
        }

        .cta-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .expiry-timer {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background: #fef2f2;
            border-radius: 8px;
            border: 1px solid #fecaca;
        }

        .expiry-timer strong {
            color: #991b1b;
            font-size: 14px;
        }

        .timer-display {
            font-size: 24px;
            font-weight: 700;
            color: #dc2626;
            margin-top: 5px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: white;
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .back-link:hover {
            transform: translateX(-5px);
        }

        .error-state {
            text-align: center;
            padding: 40px 20px;
        }

        .error-icon {
            font-size: 64px;
            color: #ef4444;
            margin-bottom: 20px;
        }

        .error-message {
            color: #1e293b;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .error-details {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .amount-value {
                font-size: 42px;
            }

            .features-grid {
                grid-template-columns: 1fr;
            }

            .offer-body {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="dashboard.html" class="back-link">
            <i class="fas fa-arrow-left"></i>
            Back to Dashboard
        </a>

        <div class="offer-card">
            <div class="offer-header">
                <div class="direct-badge">
                    <i class="fas fa-bolt"></i>
                    ZimCrowd Direct
                </div>
                <h1>Your Instant Loan Offer</h1>
                <p>Guaranteed funding in minutes</p>
            </div>

            <div class="offer-body" id="offer-content">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p style="color: #64748b;">Preparing your personalized offer...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.hostname === 'localhost'
            ? 'http://localhost:3000'
            : 'https://zimcrowd-api.onrender.com';

        let offerData = null;
        let countdownInterval = null;
        let selectedCurrency = 'USD';
        
        // Currency configuration
        const CURRENCY_CONFIG = {
            USD: {
                symbol: '$',
                name: 'US Dollar',
                flag: '🇺🇸',
                interestRate: 8,
                minLoan: 25,
                maxLoan: 3000
            },
            ZWG: {
                symbol: 'ZWG ',
                name: 'Zimbabwe Gold',
                flag: '🇿🇼',
                interestRate: 10,
                minLoan: 675,
                maxLoan: 40000
            }
        };

        // Employment-based loan limits for direct lending
        const DIRECT_LOAN_LIMITS = {
            government: {
                maxLoan: 3000,
                maxTermMonths: 24,
                usesBuffer: true,
                bufferAmount: 70,
                dtniPercentage: 0
            },
            private: {
                maxLoan: 1000,
                maxTermMonths: 12,
                usesBuffer: false,
                bufferAmount: 0,
                dtniPercentage: 0.33
            },
            informal: {
                maxLoan: 500,
                maxTermMonths: 6,
                usesBuffer: false,
                bufferAmount: 0,
                dtniPercentage: 0.33
            }
        };

        // Employment type and salary data
        let selectedEmploymentType = 'private';
        let monthlyIncome = 0;

        // Get auth token
        const authToken = localStorage.getItem('authToken');

        if (!authToken) {
            window.location.href = 'login.html?redirect=direct-loan-request.html';
        }

        // Loan details storage
        let loanDetails = {
            amount: 0,
            duration: 30,
            purpose: '',
            currency: 'USD'
        };

        // Load offer on page load
        document.addEventListener('DOMContentLoaded', () => {
            showCurrencySelector();
        });
        
        function showCurrencySelector() {
            const content = document.getElementById('offer-content');
            content.innerHTML = `
                <div style="text-align: center; margin-bottom: 20px;">
                    <h3 style="color: #1e293b; margin-bottom: 10px;">Apply for Instant Loan</h3>
                    <p style="color: #64748b; font-size: 14px;">Fill in your loan details to get a personalized offer</p>
                </div>
                
                <div class="currency-selector">
                    <button class="currency-btn ${selectedCurrency === 'USD' ? 'active' : ''}" onclick="selectCurrency('USD')">
                        <span class="flag">🇺🇸</span>
                        <span>USD</span>
                        <span class="rate-badge" style="${selectedCurrency === 'USD' ? 'background: white; color: #38e07b;' : ''}">8%/mo</span>
                    </button>
                    <button class="currency-btn ${selectedCurrency === 'ZWG' ? 'active' : ''}" onclick="selectCurrency('ZWG')">
                        <span class="flag">🇿🇼</span>
                        <span>ZWG</span>
                        <span class="rate-badge" style="${selectedCurrency === 'ZWG' ? 'background: white; color: #38e07b;' : ''}">10%/mo</span>
                    </button>
                </div>
                
                <div style="background: #f8fafc; border-radius: 12px; padding: 20px; margin-bottom: 25px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <span style="color: #64748b;">Loan Range:</span>
                        <span style="font-weight: 600; color: #1e293b;" id="loan-range">$25 - $3,000</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <span style="color: #64748b;">Interest Rate:</span>
                        <span style="font-weight: 600; color: #1e293b;" id="interest-rate">8% per month</span>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <span style="color: #64748b;">Annual Rate:</span>
                        <span style="font-weight: 600; color: #1e293b;" id="annual-rate">96% per annum</span>
                    </div>
                </div>

                <!-- Loan Application Form -->
                <div style="background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 25px;">
                    <h4 style="color: #1e293b; margin-bottom: 15px; font-size: 16px;">Loan Details</h4>
                    
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; color: #374151; font-weight: 500; margin-bottom: 8px;">Employment Type <span style="color: red;">*</span></label>
                        <select id="employment-type" style="width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px;" onchange="handleEmploymentTypeChange()">
                            <option value="government">Government Employee</option>
                            <option value="private" selected>Private Sector Employee</option>
                            <option value="informal">Informal Sector / Business</option>
                        </select>
                        <div style="margin-top: 5px; font-size: 12px; color: #64748b;" id="employment-info">
                            Maximum loan: $1,000 over 12 months
                        </div>
                    </div>

                    <div style="margin-bottom: 20px;">
                        <label style="display: block; color: #374151; font-weight: 500; margin-bottom: 8px;">Net Monthly Salary (<span id="currency-label">USD</span>) <span style="color: red;">*</span></label>
                        <input type="number" id="monthly-salary" min="100" max="10000" step="50" 
                               style="width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px;"
                               placeholder="Enter your net monthly salary" onchange="handleSalaryChange()">
                        <div style="margin-top: 5px; font-size: 12px; color: #64748b;" id="salary-info">
                            Enter your take-home pay after deductions
                        </div>
                    </div>
                    
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; color: #374151; font-weight: 500; margin-bottom: 8px;">Loan Amount (<span id="currency-label">USD</span>)</label>
                        <input type="number" id="loan-amount" min="25" max="3000" step="25" 
                               style="width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px;"
                               placeholder="Enter amount" onchange="updateLoanCalculation()">
                        <div style="margin-top: 5px; font-size: 12px; color: #64748b;" id="amount-limits">
                            Minimum: $25, Maximum: $3,000
                        </div>
                    </div>

                    <div style="margin-bottom: 20px;">
                        <label style="display: block; color: #374151; font-weight: 500; margin-bottom: 8px;">Loan Duration</label>
                        <select id="loan-duration" style="width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px;" onchange="updateLoanCalculation()">
                            <option value="30">30 days (1 month)</option>
                            <option value="60">60 days (2 months)</option>
                            <option value="90">90 days (3 months)</option>
                            <option value="180">180 days (6 months)</option>
                            <option value="360">360 days (12 months)</option>
                            <option value="720">720 days (24 months)</option>
                        </select>
                        <div style="margin-top: 5px; font-size: 12px; color: #64748b;" id="duration-info">
                            Maximum duration: 12 months
                        </div>
                    </div>

                    <div style="margin-bottom: 20px;">
                        <label style="display: block; color: #374151; font-weight: 500; margin-bottom: 8px;">Loan Purpose</label>
                        <select id="loan-purpose" style="width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px;">
                            <option value="">Select purpose</option>
                            <option value="emergency">Emergency Expenses</option>
                            <option value="business">Business Working Capital</option>
                            <option value="education">Education Fees</option>
                            <option value="medical">Medical Expenses</option>
                            <option value="personal">Personal Needs</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div id="loan-calculation" style="background: #f0f9ff; border: 1px solid #0ea5e9; border-radius: 8px; padding: 15px; display: none;">
                        <div style="font-weight: 600; color: #0369a1; margin-bottom: 10px;">Estimated Repayment</div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                            <span style="color: #64748b;">Principal:</span>
                            <span style="font-weight: 600;" id="calc-principal">$0</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                            <span style="color: #64748b;">Interest:</span>
                            <span style="font-weight: 600;" id="calc-interest">$0</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; border-top: 1px solid #0ea5e9; padding-top: 5px;">
                            <span style="color: #0369a1; font-weight: 600;">Total Repayment:</span>
                            <span style="font-weight: 700; color: #0369a1;" id="calc-total">$0</span>
                        </div>
                    </div>
                </div>
                
                <button class="cta-button" onclick="validateAndLoadOffer()">
                    <i class="fas fa-bolt"></i> Get My Instant Offer
                </button>
            `;
            updateCurrencyDisplay();
        }
        
        function selectCurrency(currency) {
            selectedCurrency = currency;
            showCurrencySelector();
        }

        function handleEmploymentTypeChange() {
            const employmentType = document.getElementById('employment-type').value;
            selectedEmploymentType = employmentType;
            
            const limits = DIRECT_LOAN_LIMITS[employmentType];
            
            // Update employment info
            const infoText = employmentType === 'government' 
                ? `Maximum loan: $${limits.maxLoan} over ${limits.maxTermMonths} months (with $${limits.bufferAmount} buffer)`
                : `Maximum loan: $${limits.maxLoan} over ${limits.maxTermMonths} months (DTNI-based)`;
            
            document.getElementById('employment-info').textContent = infoText;
            
            // Update loan amount limits
            const loanAmountInput = document.getElementById('loan-amount');
            loanAmountInput.max = limits.maxLoan;
            document.getElementById('amount-limits').textContent = `Minimum: $25, Maximum: $${limits.maxLoan}`;
            
            // Update duration options and info
            updateDurationOptions(limits.maxTermMonths);
            
            // Reset loan amount if it exceeds new limit
            if (parseFloat(loanAmountInput.value) > limits.maxLoan) {
                loanAmountInput.value = Math.min(25, limits.maxLoan);
            }
            
            // Recalculate with new limits
            updateLoanCalculation();
        }

        function handleSalaryChange() {
            monthlyIncome = parseFloat(document.getElementById('monthly-salary').value) || 0;
            updateLoanCalculation();
        }

        function updateDurationOptions(maxMonths) {
            const durationSelect = document.getElementById('loan-duration');
            const options = [
                { value: 30, text: '30 days (1 month)', months: 1 },
                { value: 60, text: '60 days (2 months)', months: 2 },
                { value: 90, text: '90 days (3 months)', months: 3 },
                { value: 180, text: '180 days (6 months)', months: 6 },
                { value: 360, text: '360 days (12 months)', months: 12 },
                { value: 720, text: '720 days (24 months)', months: 24 }
            ];
            
            // Clear existing options
            durationSelect.innerHTML = '';
            
            // Add allowed options
            options.forEach(option => {
                if (option.months <= maxMonths) {
                    const optionElement = document.createElement('option');
                    optionElement.value = option.value;
                    optionElement.textContent = option.text;
                    durationSelect.appendChild(optionElement);
                }
            });
            
            // Update duration info
            document.getElementById('duration-info').textContent = `Maximum duration: ${maxMonths} months`;
        }

        function calculateMaxLoanAmount() {
            if (!monthlyIncome || monthlyIncome <= 0) {
                return 0;
            }
            
            const limits = DIRECT_LOAN_LIMITS[selectedEmploymentType];
            
            if (limits.usesBuffer) {
                // Government: Net salary - buffer
                const availableAmount = monthlyIncome - limits.bufferAmount;
                return Math.max(0, Math.min(limits.maxLoan, availableAmount));
            } else {
                // Private/Informal: DTNI calculation using reducing balance method
                const maxInstallment = monthlyIncome * limits.dtniPercentage;
                const monthlyRate = 0.08 / 12; // 8% annual rate / 12 months
                
                // Use reducing balance formula for 3-month term as baseline
                const termMonths = 3;
                const powerTerm = Math.pow(1 + monthlyRate, termMonths);
                const maxLoan = (maxInstallment * (powerTerm - 1)) / (monthlyRate * powerTerm);
                
                return Math.min(limits.maxLoan, Math.max(0, maxLoan));
            }
        }

        function updateLoanCalculation() {
            const amount = parseFloat(document.getElementById('loan-amount').value) || 0;
            const duration = parseInt(document.getElementById('loan-duration').value) || 30;
            const config = CURRENCY_CONFIG[selectedCurrency];
            
            // Check if salary is entered
            if (!monthlyIncome || monthlyIncome <= 0) {
                document.getElementById('loan-calculation').style.display = 'none';
                document.getElementById('amount-limits').innerHTML = 
                    `<span style="color: red;">Please enter your monthly salary to calculate loan eligibility</span>`;
                return;
            }
            
            // Calculate maximum allowed amount based on employment and salary
            const maxAllowedAmount = calculateMaxLoanAmount();
            
            if (amount < config.minLoan || amount > maxAllowedAmount) {
                document.getElementById('loan-calculation').style.display = 'none';
                
                // Show warning if amount exceeds calculated limit
                if (amount > maxAllowedAmount && maxAllowedAmount > 0) {
                    document.getElementById('amount-limits').innerHTML = 
                        `Minimum: $25, Maximum: $${maxAllowedAmount} <span style="color: red;">(Based on your income)</span>`;
                } else if (maxAllowedAmount === 0) {
                    document.getElementById('amount-limits').innerHTML = 
                        `<span style="color: red;">Insufficient income for loan eligibility</span>`;
                }
                return;
            }
            
            const interestRate = config.interestRate / 100;
            const monthlyInterest = amount * interestRate;
            const totalMonths = duration / 30;
            const totalInterest = monthlyInterest * totalMonths;
            const totalRepayment = amount + totalInterest;
            
            document.getElementById('calc-principal').textContent = formatAmount(amount);
            document.getElementById('calc-interest').textContent = formatAmount(totalInterest);
            document.getElementById('calc-total').textContent = formatAmount(totalRepayment);
            document.getElementById('loan-calculation').style.display = 'block';
        }

        function validateAndLoadOffer() {
            const amount = parseFloat(document.getElementById('loan-amount').value);
            const duration = parseInt(document.getElementById('loan-duration').value);
            const purpose = document.getElementById('loan-purpose').value;
            const employmentType = document.getElementById('employment-type').value;
            const salary = parseFloat(document.getElementById('monthly-salary').value);
            const config = CURRENCY_CONFIG[selectedCurrency];
            
            // Validation
            if (!amount || isNaN(amount)) {
                showError('Please enter a valid loan amount');
                return;
            }
            
            if (!salary || salary <= 0) {
                showError('Please enter your monthly salary');
                return;
            }
            
            if (amount < config.minLoan || amount > calculateMaxLoanAmount()) {
                showError(`Loan amount must be between ${formatAmount(config.minLoan)} and ${formatAmount(calculateMaxLoanAmount())} based on your income`);
                return;
            }
            
            if (!purpose) {
                showError('Please select a loan purpose');
                return;
            }
            
            // Store loan details and proceed
            loanDetails = { 
                amount, 
                duration, 
                purpose, 
                currency: selectedCurrency,
                employmentType,
                monthlySalary: salary,
                loanType: 'direct'
            };
            loadOffer();
        }
        
        function updateCurrencyDisplay() {
            const config = CURRENCY_CONFIG[selectedCurrency];
            
            // Update currency selector info
            document.getElementById('loan-range').textContent = 
                `${config.symbol}${config.minLoan.toLocaleString()} - ${config.symbol}${config.maxLoan.toLocaleString()}`;
            document.getElementById('interest-rate').textContent = `${config.interestRate}% per month`;
            document.getElementById('annual-rate').textContent = `${config.interestRate * 12}% per annum`;
            
            // Update form currency labels
            const currencyLabel = document.getElementById('currency-label');
            if (currencyLabel) {
                currencyLabel.textContent = selectedCurrency;
            }
            
            const amountLimits = document.getElementById('amount-limits');
            if (amountLimits) {
                amountLimits.textContent = `Minimum: ${config.symbol}${config.minLoan.toLocaleString()}, Maximum: ${config.symbol}${config.maxLoan.toLocaleString()}`;
            }
            
            // Update amount input min/max and placeholder
            const amountInput = document.getElementById('loan-amount');
            if (amountInput) {
                amountInput.min = config.minLoan;
                amountInput.max = config.maxLoan;
                amountInput.step = config.minLoan;
                amountInput.placeholder = `Enter amount (${config.symbol}${config.minLoan} - ${config.symbol}${config.maxLoan})`;
            }
        }
        
        function formatAmount(amount, currency = selectedCurrency) {
            const config = CURRENCY_CONFIG[currency];
            return `${config.symbol}${amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        async function loadOffer() {
            const content = document.getElementById('offer-content');
            content.innerHTML = `
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p style="color: #64748b;">Submitting your direct loan request for admin review...</p>
                </div>
            `;
            
            try {
                // Submit direct loan request for admin review
                const response = await fetch(`${API_BASE_URL}/api/loans/create`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ 
                        amount: loanDetails.amount,
                        term: Math.floor(loanDetails.duration / 30), // Convert days to months
                        rate: 8, // Direct loan fixed rate
                        purpose: loanDetails.purpose,
                        description: `Direct loan request - ${loanDetails.employmentType} employee`,
                        loan_type: 'direct',
                        employment_type: loanDetails.employmentType,
                        monthly_salary: loanDetails.monthlySalary,
                        currency: loanDetails.currency,
                        status: 'pending_admin_review',
                        agreed_to_fees: true,
                        agreed_to_terms: true,
                        e_signature: 'Digital Signature Accepted'
                    })
                });

                const result = await response.json();

                if (result.success) {
                    // Show success message for admin review
                    displayAdminReviewConfirmation(loanDetails);
                } else {
                    showError(result.message || 'Failed to submit loan request');
                }
            } catch (error) {
                console.error('Error submitting loan request:', error);
                showError('Unable to connect to server. Please try again.');
            }
        }

        function displayAdminReviewConfirmation(loanDetails) {
            const content = document.getElementById('offer-content');
            const config = CURRENCY_CONFIG[loanDetails.currency];
            
            content.innerHTML = `
                <div style="text-align: center; margin-bottom: 30px;">
                    <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #38e77b, #34d399); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
                        <i class="fas fa-check" style="color: white; font-size: 32px;"></i>
                    </div>
                    <h3 style="color: #1e293b; margin-bottom: 10px;">Loan Request Submitted!</h3>
                    <p style="color: #64748b; font-size: 14px;">Your direct loan request has been submitted for admin review</p>
                </div>
                
                <div style="background: #f8fafc; border-radius: 12px; padding: 20px; margin-bottom: 25px;">
                    <h4 style="color: #1e293b; margin-bottom: 15px; font-size: 16px;">Request Summary</h4>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div>
                            <div style="color: #64748b; font-size: 12px; margin-bottom: 4px;">Loan Amount</div>
                            <div style="font-weight: 600; color: #1e293b;">${config.symbol}${loanDetails.amount.toLocaleString()}</div>
                        </div>
                        <div>
                            <div style="color: #64748b; font-size: 12px; margin-bottom: 4px;">Duration</div>
                            <div style="font-weight: 600; color: #1e293b;">${Math.floor(loanDetails.duration / 30)} months</div>
                        </div>
                        <div>
                            <div style="color: #64748b; font-size: 12px; margin-bottom: 4px;">Employment Type</div>
                            <div style="font-weight: 600; color: #1e293b;">${loanDetails.employmentType.charAt(0).toUpperCase() + loanDetails.employmentType.slice(1)}</div>
                        </div>
                        <div>
                            <div style="color: #64748b; font-size: 12px; margin-bottom: 4px;">Monthly Salary</div>
                            <div style="font-weight: 600; color: #1e293b;">${config.symbol}${loanDetails.monthlySalary.toLocaleString()}</div>
                        </div>
                    </div>
                </div>
                
                <div style="background: #fff7ed; border: 1px solid #fed7aa; border-radius: 8px; padding: 15px; margin-bottom: 25px;">
                    <div style="display: flex; align-items: center; margin-bottom: 10px;">
                        <i class="fas fa-clock" style="color: #f59e0b; margin-right: 10px;"></i>
                        <span style="font-weight: 600; color: #1e293b;">Pending Admin Review</span>
                    </div>
                    <p style="color: #64748b; font-size: 14px; margin: 0;">Your loan request is being reviewed by our admin team. You will receive an email notification once a decision has been made.</p>
                </div>
                
                <div style="display: flex; gap: 10px;">
                    <button class="cta-button" style="flex: 1;" onclick="window.location.href='dashboard.html'">
                        <i class="fas fa-arrow-left"></i> Back to Dashboard
                    </button>
                    <button class="btn btn-secondary" style="flex: 1;" onclick="window.location.reload()">
                        <i class="fas fa-plus"></i> New Request
                    </button>
                </div>
            `;
        }

        function displayOffer(offer) {
            const content = document.getElementById('offer-content');
            const config = CURRENCY_CONFIG[offer.currency || selectedCurrency];
            const principal = offer.principalAmount || offer.amount;
            const interest = offer.interestAmount || offer.fixedFee || (principal * config.interestRate / 100);
            const total = offer.totalRepayment || (principal + interest);
            const termMonths = offer.termMonths || 1;
            const monthlyPayment = offer.monthlyPayment || (total / termMonths);
            
            console.log('🎯 Displaying offer:', offer);
            
            content.innerHTML = `
                <div style="text-align: center; margin-bottom: 15px;">
                    <span class="currency-btn active" style="display: inline-flex; cursor: default;">
                        <span class="flag">${config.flag}</span>
                        <span>${offer.currency || selectedCurrency}</span>
                        <span class="rate-badge" style="background: white; color: #38e07b;">${config.interestRate}%/mo</span>
                    </span>
                </div>
                
                <div class="amount-display">
                    <div class="amount-label">You Get</div>
                    <div class="amount-value">${formatAmount(principal)}</div>
                    <div class="amount-subtitle">Instant deposit to your ${offer.currency || selectedCurrency} wallet</div>
                </div>

                <div class="breakdown-section">
                    <div class="breakdown-title">💰 Loan Breakdown</div>
                    <div class="breakdown-row">
                        <span class="breakdown-label">Principal Amount</span>
                        <span class="breakdown-value">${formatAmount(principal)}</span>
                    </div>
                    <div class="breakdown-row">
                        <span class="breakdown-label">Interest (${config.interestRate}% × ${termMonths} month${termMonths > 1 ? 's' : ''})</span>
                        <span class="breakdown-value">${formatAmount(interest)}</span>
                    </div>
                    <div class="breakdown-row">
                        <span class="breakdown-label">Monthly Payment</span>
                        <span class="breakdown-value">${formatAmount(monthlyPayment)}</span>
                    </div>
                    <div class="breakdown-row">
                        <span class="breakdown-label">Total Repayment</span>
                        <span class="breakdown-value">${formatAmount(total)}</span>
                    </div>
                </div>

                <div class="apr-disclosure">
                    <strong>📊 Interest Rate: ${config.interestRate}% per month (${config.interestRate * 12}% per annum)</strong>
                    <p>Term: ${termMonths} month${termMonths > 1 ? 's' : ''}. 
                    ${offer.dueDate ? `Due date: ${new Date(offer.dueDate).toLocaleDateString('en-US', { 
                        month: 'long', 
                        day: 'numeric', 
                        year: 'numeric' 
                    })}` : ''}</p>
                </div>

                <div class="features-grid">
                    <div class="feature-item">
                        <div class="feature-icon">⚡</div>
                        <div class="feature-text">Instant Approval</div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon">💰</div>
                        <div class="feature-text">Funds in Minutes</div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon">🔒</div>
                        <div class="feature-text">Secure & Safe</div>
                    </div>
                </div>

                <button class="cta-button" onclick="acceptOffer()">
                    <i class="fas fa-check-circle"></i> Accept Offer & Continue
                </button>

                <div class="expiry-timer">
                    <strong>⏰ Offer expires in:</strong>
                    <div class="timer-display" id="countdown">23:59:59</div>
                </div>
                
                <button onclick="showCurrencySelector()" style="width: 100%; margin-top: 15px; padding: 12px; background: transparent; border: 2px solid #e2e8f0; border-radius: 12px; color: #64748b; font-weight: 600; cursor: pointer;">
                    <i class="fas fa-exchange-alt"></i> Change Currency
                </button>
                
                <!-- DEBUG: Always visible accept button -->
                <div style="margin-top: 20px; padding: 15px; background: #f0f9ff; border: 2px solid #0ea5e9; border-radius: 12px;">
                    <div style="color: #0369a1; font-weight: 600; margin-bottom: 10px;">🔧 Debug: Accept Loan Offer</div>
                    <button onclick="acceptOffer()" style="width: 100%; padding: 15px; background: #0ea5e9; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">
                        <i class="fas fa-check-circle"></i> Accept Offer & Continue to Agreement
                    </button>
                </div>
            `;
            
            // Store offer data
            offerData = offer;
            
            // Start countdown timer
            if (offer.expiresAt) {
                startCountdown(offer.expiresAt);
            } else {
                // Default 24-hour expiry if not specified
                const expiresAt = new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString();
                startCountdown(expiresAt);
            }
        }

        function startCountdown(expiresAt) {
            const expiryTime = new Date(expiresAt).getTime();

            countdownInterval = setInterval(() => {
                const now = new Date().getTime();
                const distance = expiryTime - now;

                if (distance < 0) {
                    clearInterval(countdownInterval);
                    document.getElementById('countdown').textContent = 'EXPIRED';
                    document.querySelector('.cta-button').disabled = true;
                    document.querySelector('.cta-button').textContent = 'Offer Expired';
                    return;
                }

                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById('countdown').textContent = 
                    `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
        }

        function acceptOffer() {
            if (!offerData) return;
            
            // Store offer data for agreement page
            localStorage.setItem('directLoanOffer', JSON.stringify(offerData));
            
            // Redirect to agreement page with offer ID
            window.location.href = `direct-loan-agreement.html?offer_id=${offerData.offerId}`;
        }

        function showError(message) {
            const content = document.getElementById('offer-content');
            content.innerHTML = `
                <div class="error-state">
                    <div class="error-icon">
                        <i class="fas fa-exclamation-circle"></i>
                    </div>
                    <div class="error-message">${message}</div>
                    <div class="error-details">
                        This could be because:
                        <ul style="text-align: left; display: inline-block; margin-top: 10px;">
                            <li>You have an active loan in arrears</li>
                            <li>Your account is suspended or banned</li>
                            <li>Server connection issue</li>
                        </ul>
                    </div>
                    <button class="cta-button" onclick="window.location.href='dashboard.html'">
                        Return to Dashboard
                    </button>
                </div>
            `;
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
        });
    </script>
</body>
</html>
