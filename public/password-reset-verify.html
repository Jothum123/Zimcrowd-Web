<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Code - ZimCrowd</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: 
                linear-gradient(135deg, rgba(25, 26, 35, 0.95) 0%, rgba(42, 43, 53, 0.95) 100%),
                url('/assets/images/pexels-brett-sayles-3963829.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow-y: auto;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(56, 224, 123, 0.15) 0%, transparent 70%);
            animation: pulse 15s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(180deg); }
        }

        .verify-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 450px;
            max-height: 90vh;
            padding: 40px;
            animation: slideUp 0.5s ease;
            position: relative;
            z-index: 1;
            overflow-y: auto;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .logo h1 {
            color: #38e07b;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(56, 224, 123, 0.3);
        }

        .logo p {
            color: #F3F3F3;
            font-size: 0.95rem;
            opacity: 0.9;
            line-height: 1.5;
        }

        .sent-to {
            color: #38e07b;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #FFFFFF;
            font-weight: 600;
            font-size: 14px;
        }

        .otp-inputs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .otp-input {
            width: 50px;
            height: 55px;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #FFFFFF;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }

        .otp-input:focus {
            outline: none;
            border-color: #38e07b;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(56, 224, 123, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #38e07b 0%, #2bc76a 100%);
            color: #191a23;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
            box-shadow: 0 4px 20px rgba(56, 224, 123, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(56, 224, 123, 0.5);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .resend-section {
            text-align: center;
            margin-top: 20px;
        }

        .resend-text {
            color: #F3F3F3;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .btn-resend {
            background: none;
            border: none;
            color: #38e07b;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            text-decoration: underline;
        }

        .btn-resend:hover {
            color: #2bc76a;
        }

        .btn-resend:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: rgba(56, 224, 123, 0.2);
            border: 1px solid rgba(56, 224, 123, 0.3);
            color: #38e07b;
        }

        .alert-error {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #38e07b;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #191a23;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .otp-input {
                width: 45px;
                height: 50px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="verify-container">
        <div class="logo">
            <div class="logo-icon">📧</div>
            <h1>Verify Code</h1>
            <p>We sent a 6-digit code to<br><span class="sent-to" id="sentTo"></span></p>
        </div>

        <div id="alertBox" class="alert"></div>

        <form id="verifyForm">
            <div class="form-group">
                <label>Enter Verification Code</label>
                <div class="otp-inputs">
                    <input type="text" class="otp-input" maxlength="1" id="otp1" autocomplete="off">
                    <input type="text" class="otp-input" maxlength="1" id="otp2" autocomplete="off">
                    <input type="text" class="otp-input" maxlength="1" id="otp3" autocomplete="off">
                    <input type="text" class="otp-input" maxlength="1" id="otp4" autocomplete="off">
                    <input type="text" class="otp-input" maxlength="1" id="otp5" autocomplete="off">
                    <input type="text" class="otp-input" maxlength="1" id="otp6" autocomplete="off">
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                Verify Code
            </button>
        </form>

        <div class="resend-section">
            <p class="resend-text">Didn't receive the code?</p>
            <button type="button" class="btn-resend" id="resendBtn">Resend Code</button>
        </div>

        <div class="back-link">
            <a href="/password-reset-request.html">← Try Different Email/Phone</a>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3001/api/auth';

        // Get identifier from localStorage
        const identifier = localStorage.getItem('resetIdentifier');
        if (!identifier) {
            window.location.href = '/password-reset-request.html';
        }

        // Display identifier (masked)
        document.getElementById('sentTo').textContent = maskIdentifier(identifier);

        function maskIdentifier(str) {
            if (str.includes('@')) {
                // Email
                const [name, domain] = str.split('@');
                return name.substring(0, 2) + '***@' + domain;
            } else {
                // Phone
                return str.substring(0, 6) + '***' + str.substring(str.length - 2);
            }
        }

        function showAlert(message, type = 'error') {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type} show`;
            
            setTimeout(() => {
                alertBox.classList.remove('show');
            }, 5000);
        }

        // OTP Input handling
        const otpInputs = document.querySelectorAll('.otp-input');
        
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });

            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').slice(0, 6);
                pastedData.split('').forEach((char, i) => {
                    if (otpInputs[i]) {
                        otpInputs[i].value = char;
                    }
                });
                if (pastedData.length === 6) {
                    otpInputs[5].focus();
                }
            });
        });

        // Auto-focus first input
        otpInputs[0].focus();

        // Verify form submission
        document.getElementById('verifyForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const otp = Array.from(otpInputs).map(input => input.value).join('');
            const submitBtn = document.getElementById('submitBtn');

            if (otp.length !== 6) {
                showAlert('Please enter all 6 digits');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span>Verifying...';

            try {
                const response = await fetch(`${API_URL}/password-reset/verify`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        identifier,
                        otp 
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Store reset token
                    localStorage.setItem('resetToken', data.resetToken);
                    
                    showAlert('Code verified! Redirecting...', 'success');
                    
                    // Redirect to new password page
                    setTimeout(() => {
                        window.location.href = '/password-reset-new.html';
                    }, 1500);
                } else {
                    showAlert(data.message || 'Invalid verification code');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Verify Code';
                    
                    // Clear inputs
                    otpInputs.forEach(input => input.value = '');
                    otpInputs[0].focus();
                }
            } catch (error) {
                console.error('Verification error:', error);
                showAlert('An error occurred. Please try again.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Verify Code';
            }
        });

        // Resend code
        document.getElementById('resendBtn').addEventListener('click', async () => {
            const resendBtn = document.getElementById('resendBtn');
            resendBtn.disabled = true;
            resendBtn.textContent = 'Sending...';

            try {
                const response = await fetch(`${API_URL}/password-reset/request`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ identifier })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('New code sent!', 'success');
                    
                    // Clear inputs
                    otpInputs.forEach(input => input.value = '');
                    otpInputs[0].focus();
                    
                    // Re-enable after 30 seconds
                    setTimeout(() => {
                        resendBtn.disabled = false;
                        resendBtn.textContent = 'Resend Code';
                    }, 30000);
                } else {
                    showAlert(data.message || 'Failed to resend code');
                    resendBtn.disabled = false;
                    resendBtn.textContent = 'Resend Code';
                }
            } catch (error) {
                console.error('Resend error:', error);
                showAlert('An error occurred. Please try again.');
                resendBtn.disabled = false;
                resendBtn.textContent = 'Resend Code';
            }
        });
    </script>
</body>
</html>
