<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - ZimCrowd</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: 
                linear-gradient(135deg, rgba(25, 26, 35, 0.95) 0%, rgba(42, 43, 53, 0.95) 100%),
                url('/assets/images/pexels-brett-sayles-3963829.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow-y: auto;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(56, 224, 123, 0.15) 0%, transparent 70%);
            animation: pulse 15s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(180deg); }
        }

        .reset-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 450px;
            max-height: 90vh;
            padding: 40px;
            animation: slideUp 0.5s ease;
            position: relative;
            z-index: 1;
            overflow-y: auto;
        }

        .reset-container::-webkit-scrollbar {
            width: 8px;
        }

        .reset-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .reset-container::-webkit-scrollbar-thumb {
            background: rgba(56, 224, 123, 0.3);
            border-radius: 10px;
        }

        .reset-container::-webkit-scrollbar-thumb:hover {
            background: rgba(56, 224, 123, 0.5);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .logo h1 {
            color: #38e07b;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(56, 224, 123, 0.3);
        }

        .logo p {
            color: #F3F3F3;
            font-size: 0.95rem;
            opacity: 0.9;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #FFFFFF;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.05);
            color: #FFFFFF;
            backdrop-filter: blur(10px);
        }

        input::placeholder {
            color: rgba(243, 243, 243, 0.5);
        }

        input:focus {
            outline: none;
            border-color: #38e07b;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(56, 224, 123, 0.2),
                        0 0 20px rgba(56, 224, 123, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #38e07b 0%, #2bc76a 100%);
            color: #191a23;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(56, 224, 123, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(56, 224, 123, 0.5);
            background: linear-gradient(135deg, #2bc76a 0%, #38e07b 100%);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: rgba(56, 224, 123, 0.2);
            border: 1px solid rgba(56, 224, 123, 0.3);
            color: #38e07b;
        }

        .alert-error {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #38e07b;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #191a23;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .reset-container {
                padding: 30px 25px;
            }

            .logo h1 {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="logo">
            <div class="logo-icon">🔒</div>
            <h1>Reset Password</h1>
            <p>Enter your email or phone number to receive a verification code</p>
        </div>

        <div id="alertBox" class="alert"></div>

        <form id="resetForm">
            <div class="form-group">
                <label for="identifier">Email or Phone Number</label>
                <input 
                    type="text" 
                    id="identifier" 
                    name="identifier" 
                    placeholder="email@example.com or +263771234567"
                    required
                    autocomplete="username"
                >
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                Send Verification Code
            </button>
        </form>

        <div class="back-link">
            <a href="/login.html">← Back to Login</a>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3001/api/auth';

        function showAlert(message, type = 'error') {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type} show`;
            
            setTimeout(() => {
                alertBox.classList.remove('show');
            }, 5000);
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const identifier = document.getElementById('identifier').value.trim();
            const submitBtn = document.getElementById('submitBtn');

            if (!identifier) {
                showAlert('Please enter your email or phone number');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span>Sending code...';

            try {
                const response = await fetch(`${API_URL}/password-reset/request`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ identifier })
                });

                const data = await response.json();

                if (data.success) {
                    // Store identifier for verification page
                    localStorage.setItem('resetIdentifier', identifier);
                    
                    showAlert('Verification code sent! Redirecting...', 'success');
                    
                    // Redirect to verification page
                    setTimeout(() => {
                        window.location.href = '/password-reset-verify.html';
                    }, 1500);
                } else {
                    showAlert(data.message || 'Failed to send verification code');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Send Verification Code';
                }
            } catch (error) {
                console.error('Password reset error:', error);
                showAlert('An error occurred. Please try again.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Send Verification Code';
            }
        });
    </script>
</body>
</html>
