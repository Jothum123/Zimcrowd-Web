<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Password - ZimCrowd</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: 
                linear-gradient(135deg, rgba(25, 26, 35, 0.95) 0%, rgba(42, 43, 53, 0.95) 100%),
                url('/assets/images/pexels-brett-sayles-3963829.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow-y: auto;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(56, 224, 123, 0.15) 0%, transparent 70%);
            animation: pulse 15s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(180deg); }
        }

        .password-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 450px;
            max-height: 90vh;
            padding: 40px;
            animation: slideUp 0.5s ease;
            position: relative;
            z-index: 1;
            overflow-y: auto;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .logo h1 {
            color: #38e07b;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(56, 224, 123, 0.3);
        }

        .logo p {
            color: #F3F3F3;
            font-size: 0.95rem;
            opacity: 0.9;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #FFFFFF;
            font-weight: 600;
            font-size: 14px;
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle input {
            padding-right: 50px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.05);
            color: #FFFFFF;
            backdrop-filter: blur(10px);
        }

        input::placeholder {
            color: rgba(243, 243, 243, 0.5);
        }

        input:focus {
            outline: none;
            border-color: #38e07b;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(56, 224, 123, 0.2),
                        0 0 20px rgba(56, 224, 123, 0.1);
        }

        .toggle-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #F3F3F3;
            cursor: pointer;
            font-size: 14px;
            padding: 5px;
        }

        .toggle-btn:hover {
            color: #38e07b;
        }

        .password-requirements {
            font-size: 12px;
            color: #F3F3F3;
            margin-top: 5px;
            line-height: 1.5;
            opacity: 0.7;
        }

        .password-requirements.valid {
            color: #38e07b;
            opacity: 1;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #38e07b 0%, #2bc76a 100%);
            color: #191a23;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            box-shadow: 0 4px 20px rgba(56, 224, 123, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(56, 224, 123, 0.5);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: rgba(56, 224, 123, 0.2);
            border: 1px solid rgba(56, 224, 123, 0.3);
            color: #38e07b;
        }

        .alert-error {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #191a23;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="password-container">
        <div class="logo">
            <div class="logo-icon">🔑</div>
            <h1>New Password</h1>
            <p>Create a strong password for your account</p>
        </div>

        <div id="alertBox" class="alert"></div>

        <form id="passwordForm">
            <div class="form-group">
                <label for="password">New Password</label>
                <div class="password-toggle">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter new password"
                        required
                        autocomplete="new-password"
                    >
                    <button type="button" class="toggle-btn" onclick="togglePassword('password')">
                        👁️
                    </button>
                </div>
                <div class="password-requirements" id="passwordReq">
                    Must be 8+ characters with uppercase, lowercase, and number
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="password-toggle">
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirmPassword" 
                        placeholder="Confirm new password"
                        required
                        autocomplete="new-password"
                    >
                    <button type="button" class="toggle-btn" onclick="togglePassword('confirmPassword')">
                        👁️
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                Reset Password
            </button>
        </form>
    </div>

    <script>
        const API_URL = 'http://localhost:3001/api/auth';

        // Check for reset token
        const resetToken = localStorage.getItem('resetToken');
        const identifier = localStorage.getItem('resetIdentifier');
        
        if (!resetToken || !identifier) {
            window.location.href = '/password-reset-request.html';
        }

        function showAlert(message, type = 'error') {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type} show`;
            
            setTimeout(() => {
                alertBox.classList.remove('show');
            }, 5000);
        }

        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            field.type = field.type === 'password' ? 'text' : 'password';
        }

        function validatePassword(password) {
            const minLength = password.length >= 8;
            const hasUpperCase = /[A-Z]/.test(password);
            const hasLowerCase = /[a-z]/.test(password);
            const hasNumber = /\d/.test(password);
            
            return minLength && hasUpperCase && hasLowerCase && hasNumber;
        }

        // Password validation
        document.getElementById('password').addEventListener('input', (e) => {
            const password = e.target.value;
            const reqElement = document.getElementById('passwordReq');
            
            if (validatePassword(password)) {
                reqElement.classList.add('valid');
                reqElement.textContent = '✓ Password meets requirements';
            } else {
                reqElement.classList.remove('valid');
                reqElement.textContent = 'Must be 8+ characters with uppercase, lowercase, and number';
            }
        });

        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submitBtn');

            if (!validatePassword(password)) {
                showAlert('Password must be 8+ characters with uppercase, lowercase, and number');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('Passwords do not match');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span>Resetting password...';

            try {
                const response = await fetch(`${API_URL}/password-reset/confirm`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        identifier,
                        resetToken,
                        newPassword: password
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('Password reset successful! Redirecting to login...', 'success');
                    
                    // Clear stored data
                    localStorage.removeItem('resetToken');
                    localStorage.removeItem('resetIdentifier');
                    
                    // Redirect to login
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    showAlert(data.message || 'Failed to reset password');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Reset Password';
                }
            } catch (error) {
                console.error('Password reset error:', error);
                showAlert('An error occurred. Please try again.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Reset Password';
            }
        });
    </script>
</body>
</html>
