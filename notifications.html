<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - ZimCrowd</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            color: #e2e8f0;
        }

        body.light-mode {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: #1f2937;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        body.light-mode .header {
            background: white;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 i {
            color: #10b981;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #e2e8f0;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        body.light-mode .back-btn {
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            color: #374151;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        body.light-mode .filter-btn {
            background: white;
            border: 1px solid #e5e7eb;
            color: #6b7280;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #10b981;
            border-color: #10b981;
            color: white;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .action-btn {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #94a3b8;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        body.light-mode .action-btn {
            border: 1px solid #e5e7eb;
            color: #6b7280;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
        }

        .notification-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .notification-card {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        body.light-mode .notification-card {
            background: white;
            border: 1px solid #e5e7eb;
        }

        .notification-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(5px);
        }

        .notification-card.unread {
            border-left: 4px solid #10b981;
            background: rgba(16, 185, 129, 0.05);
        }

        .notification-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .notification-icon.success {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .notification-icon.error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .notification-icon.warning {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        .notification-icon.info {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
        }

        .notification-icon.payment {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .notification-icon.loan {
            background: rgba(139, 92, 246, 0.2);
            color: #8b5cf6;
        }

        .notification-icon.investment {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
        }

        .notification-body {
            flex: 1;
        }

        .notification-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
            color: #e2e8f0;
        }

        body.light-mode .notification-title {
            color: #1f2937;
        }

        .notification-message {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        body.light-mode .notification-message {
            color: #6b7280;
        }

        .notification-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 12px;
            color: #64748b;
        }

        .notification-time {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .notification-actions {
            display: flex;
            gap: 8px;
        }

        .notification-action {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 6px;
            color: #94a3b8;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .notification-action:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #e2e8f0;
        }

        .notification-action.delete:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #94a3b8;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .loading i {
            font-size: 32px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 30px;
        }

        .page-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .page-btn:hover, .page-btn.active {
            background: #10b981;
            border-color: #10b981;
            color: white;
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-bell"></i> Notifications</h1>
            <a href="dashboard.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="unread">Unread</button>
            <button class="filter-btn" data-filter="payment">Payments</button>
            <button class="filter-btn" data-filter="loan">Loans</button>
            <button class="filter-btn" data-filter="investment">Investments</button>
            <button class="filter-btn" data-filter="security">Security</button>
        </div>

        <div class="actions">
            <button class="action-btn" onclick="markAllAsRead()">
                <i class="fas fa-check-double"></i> Mark all as read
            </button>
            <button class="action-btn" onclick="deleteAllRead()">
                <i class="fas fa-trash"></i> Delete read
            </button>
        </div>

        <div id="notificationList" class="notification-list">
            <div class="loading">
                <i class="fas fa-spinner"></i>
                <p>Loading notifications...</p>
            </div>
        </div>

        <div id="pagination" class="pagination" style="display: none;">
            <button class="page-btn" onclick="prevPage()" id="prevBtn">
                <i class="fas fa-chevron-left"></i> Previous
            </button>
            <span id="pageInfo" style="padding: 8px 16px; color: #94a3b8;">Page 1 of 1</span>
            <button class="page-btn" onclick="nextPage()" id="nextBtn">
                Next <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <script src="js/api-config.js"></script>
    <script>
        let notifications = [];
        let currentFilter = 'all';
        let currentPage = 1;
        const perPage = 10;

        // Check theme
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
        }

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                currentPage = 1;
                renderNotifications();
            });
        });

        async function loadNotifications() {
            try {
                const token = localStorage.getItem('authToken') || localStorage.getItem('token') || localStorage.getItem('access_token');
                if (!token) {
                    window.location.href = 'login.html';
                    return;
                }

                const API_BASE = window.API_CONFIG?.baseURL || 'https://zimcrowd-api.onrender.com/api';
                const response = await fetch(`${API_BASE}/notifications?limit=100`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    notifications = data.data || [];
                    renderNotifications();
                } else {
                    showEmptyState('Failed to load notifications');
                }
            } catch (error) {
                console.error('Error loading notifications:', error);
                showEmptyState('Failed to load notifications');
            }
        }

        function renderNotifications() {
            const container = document.getElementById('notificationList');
            
            // Filter notifications
            let filtered = notifications;
            if (currentFilter === 'unread') {
                filtered = notifications.filter(n => !n.read);
            } else if (currentFilter !== 'all') {
                filtered = notifications.filter(n => n.type === currentFilter);
            }

            // Paginate
            const totalPages = Math.ceil(filtered.length / perPage);
            const start = (currentPage - 1) * perPage;
            const paginated = filtered.slice(start, start + perPage);

            if (paginated.length === 0) {
                showEmptyState('No notifications found');
                document.getElementById('pagination').style.display = 'none';
                return;
            }

            container.innerHTML = paginated.map(n => `
                <div class="notification-card ${!n.read ? 'unread' : ''}" data-id="${n.id}">
                    <div class="notification-icon ${n.type || 'info'}">
                        <i class="fas ${getIcon(n.type)}"></i>
                    </div>
                    <div class="notification-body">
                        <div class="notification-title">${n.title}</div>
                        <div class="notification-message">${n.message}</div>
                        <div class="notification-meta">
                            <span class="notification-time">
                                <i class="fas fa-clock"></i> ${formatTime(n.created_at)}
                            </span>
                            <div class="notification-actions">
                                ${!n.read ? `<button class="notification-action" onclick="markAsRead('${n.id}')">Mark as read</button>` : ''}
                                <button class="notification-action delete" onclick="deleteNotification('${n.id}')">Delete</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            // Update pagination
            if (totalPages > 1) {
                document.getElementById('pagination').style.display = 'flex';
                document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
                document.getElementById('prevBtn').disabled = currentPage === 1;
                document.getElementById('nextBtn').disabled = currentPage === totalPages;
            } else {
                document.getElementById('pagination').style.display = 'none';
            }
        }

        function showEmptyState(message) {
            document.getElementById('notificationList').innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-bell-slash"></i>
                    <h3>${message}</h3>
                    <p>You're all caught up!</p>
                </div>
            `;
        }

        function getIcon(type) {
            const icons = {
                'success': 'fa-check-circle',
                'error': 'fa-times-circle',
                'warning': 'fa-exclamation-triangle',
                'info': 'fa-info-circle',
                'payment': 'fa-dollar-sign',
                'loan': 'fa-hand-holding-usd',
                'investment': 'fa-chart-line',
                'security': 'fa-shield-alt'
            };
            return icons[type] || 'fa-bell';
        }

        function formatTime(dateString) {
            if (!dateString) return 'Just now';
            const date = new Date(dateString);
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);
            
            if (seconds < 60) return 'Just now';
            if (seconds < 3600) return `${Math.floor(seconds / 60)} minutes ago`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)} hours ago`;
            if (seconds < 604800) return `${Math.floor(seconds / 86400)} days ago`;
            return date.toLocaleDateString();
        }

        async function markAsRead(id) {
            try {
                const token = localStorage.getItem('authToken') || localStorage.getItem('token') || localStorage.getItem('access_token');
                const API_BASE = window.API_CONFIG?.baseURL || 'https://zimcrowd-api.onrender.com/api';
                
                await fetch(`${API_BASE}/notifications/${id}/read`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const notification = notifications.find(n => n.id === id);
                if (notification) notification.read = true;
                renderNotifications();
            } catch (error) {
                console.error('Error marking as read:', error);
            }
        }

        async function markAllAsRead() {
            try {
                const token = localStorage.getItem('authToken') || localStorage.getItem('token') || localStorage.getItem('access_token');
                const API_BASE = window.API_CONFIG?.baseURL || 'https://zimcrowd-api.onrender.com/api';
                
                await fetch(`${API_BASE}/notifications/read-all`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                notifications.forEach(n => n.read = true);
                renderNotifications();
            } catch (error) {
                console.error('Error marking all as read:', error);
            }
        }

        async function deleteNotification(id) {
            try {
                const token = localStorage.getItem('authToken') || localStorage.getItem('token') || localStorage.getItem('access_token');
                const API_BASE = window.API_CONFIG?.baseURL || 'https://zimcrowd-api.onrender.com/api';
                
                await fetch(`${API_BASE}/notifications/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                notifications = notifications.filter(n => n.id !== id);
                renderNotifications();
            } catch (error) {
                console.error('Error deleting notification:', error);
            }
        }

        async function deleteAllRead() {
            try {
                const token = localStorage.getItem('authToken') || localStorage.getItem('token') || localStorage.getItem('access_token');
                const API_BASE = window.API_CONFIG?.baseURL || 'https://zimcrowd-api.onrender.com/api';
                
                await fetch(`${API_BASE}/notifications/delete-read`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                notifications = notifications.filter(n => !n.read);
                renderNotifications();
            } catch (error) {
                console.error('Error deleting read notifications:', error);
            }
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderNotifications();
            }
        }

        function nextPage() {
            currentPage++;
            renderNotifications();
        }

        // Load notifications on page load
        loadNotifications();
    </script>
</body>
</html>
